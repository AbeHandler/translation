# Paraphrase (indirect attribution) detection on PolNeAR (scripts/train_paraphrase_detector.py). Outputs go to
# results/train_paraphrase_detector/<experiment_name>/: model/, label_map.json, eval_report.json, logs/.
experiment_name: electra_small
model:
  # small enough to train on a laptop; on Alpine try bert-base-cased or roberta-base (new experiment_name)
  base_model: google/electra-small-discriminator
  max_seq_length: 512   # paragraphs are cut into chunks of <= 150 words (MAX_WORDS in polnear.py)
data:
  polnear_dir: data/external/polnear/data   # git clone https://github.com/networkdynamics/PolNeAR data/external/polnear
training:   # PolNeAR's own train/dev/test splits
  epochs: 5
  batch_size: 16
  learning_rate: 1e-4   # ELECTRA-small is usually fine-tuned at ~1e-4; use 3e-5 for bert-base / roberta-base
  weight_decay: 0.01
  warmup_ratio: 0.06
  eval_strategy: epoch
  save_strategy: epoch
  metric_for_best_model: f1
  early_stopping_patience: 2
  seed: 42
