# Direct-quote extraction on DirectQuote (scripts/train_quote_extractor.py). Outputs go to
# results/train_quote_extractor/<experiment_name>/: model/, label_map.json, eval_report.json, logs/.
experiment_name: electra_small
model:
  # small enough to train on a laptop; on Alpine try bert-base-cased or roberta-base (new experiment_name)
  base_model: google/electra-small-discriminator
  max_seq_length: 256
data:
  raw_path: data/external/directquote/data/truecased.txt   # git clone https://github.com/THUNLP-MT/DirectQuote
  train_frac: 0.8   # contiguous blocks in file order (no article ids in the data); test is the rest
  dev_frac: 0.1
training:
  epochs: 5
  batch_size: 16
  learning_rate: 1e-4   # ELECTRA-small is usually fine-tuned at ~1e-4; use 3e-5 for bert-base / roberta-base
  weight_decay: 0.01
  warmup_ratio: 0.06
  eval_strategy: epoch
  save_strategy: epoch
  metric_for_best_model: f1
  early_stopping_patience: 2
  seed: 42
